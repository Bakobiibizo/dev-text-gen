services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.31.1}
    restart: unless-stopped
    volumes:
      - ${OLLAMA_MODELS_PATH:-ollama-models}:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

  proxy:
    build: .
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-7103}:7103"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 7103
      API_TOKEN: ${API_TOKEN:-}
      OLLAMA_URL: http://ollama:11434
      MODEL_NAME: ${MODEL_NAME:-gemma3:1b}
      PRELOAD: ${PRELOAD:-false}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-10485760}

volumes:
  ollama-models:
